<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#045aa3">
  <title>SendIt</title>
  <!-- Apply the saved theme before the page paints. -->
  <script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" href="/static/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/icon-64.png" alt="" width="32" height="32">
      <span class="wordmark" id="brand">Send<b>It</b></span>
    </div>
    <div class="whoami" id="whoami"></div>
  </header>
  <main id="app"><p class="loading">Loading…</p></main>
  <div id="overlays"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
